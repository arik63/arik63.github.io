<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0c10">
    <title>// under renovation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c10;
            font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #e2e8f0;
        }

        /* subtle scanline / code glow */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 255, 255, 0.02) 0px, rgba(0, 255, 255, 0.02) 1px, transparent 1px, transparent 8px);
            pointer-events: none;
        }

        .terminal {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }

        /* prompt line */
        .prompt {
            display: inline-flex;
            align-items: baseline;
            gap: 0.5rem;
            font-size: 1rem;
            color: #6ee7ff;
            margin-bottom: 1.8rem;
            font-weight: 500;
        }

        .prompt-sign {
            color: #3bffb0;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2rem;
            background-color: #9effcf;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #e2e8f0, #8ab3ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }

        .message {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.5;
            margin: 1.2rem 0;
            border-left: 2px solid #2d68b0;
            padding-left: 1rem;
            text-align: left;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .code-line {
            font-family: monospace;
            font-size: 0.8rem;
            color: #5f7f9e;
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        hr {
            width: 60px;
            margin: 1.5rem auto 0;
            border: 0;
            height: 1px;
            background: #2d3e5f;
        }

        a {
            color: #6aa9ff;
            text-decoration: none;
            border-bottom: 1px dotted #3b82f6;
        }

        a:hover {
            color: #9effcf;
        }

        /* minimal & clean */
        .footer {
            font-size: 0.7rem;
            color: #3f5e7e;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
<div class="terminal">
    <div class="prompt">
        <span class="prompt-sign">➜</span>
        <span>~/github/index</span>
        <span class="cursor"></span>
    </div>

    <h1>under renovation</h1>

    <div class="message">
        <span style="color:#8ab3ff;">//</span> fresh code & design in progress.<br>
        back online soon.
    </div>

    <div class="code-line">
        <span>✦</span> <span>git status — rebuilding</span> <span>✦</span>
    </div>

    <hr>

    <div class="footer">
        <span>🚧</span> <a href="#">github pages</a> · maintenance mode
    </div>
</div>
</body>
</html>
